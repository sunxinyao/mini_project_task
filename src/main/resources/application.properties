spring.application.name=task

# ---------- MySQL 持久化 ----------
spring.datasource.url=jdbc:mysql://localhost:3306/task_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

# ---------- MyBatis ----------
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- Jackson：接口字段统一 snake_case，时间输出 ISO-8601(UTC) ----------
spring.jackson.property-naming-strategy=SNAKE_CASE

# ---------- 任务租约 ----------
# 领取任务后 lease_expires_at = 领取时间 + task.lease.seconds（默认 3 分钟）
task.lease.seconds=180
# 租约过期巡检间隔
task.lease.check-interval-ms=2000
