# 测试环境：H2 内存库（MySQL 兼容模式），不依赖外部 MySQL / Docker，保证测试稳定可重复。
# 如需用真实 MySQL 跑集成测试，把下面的 url/username/password 改成 MySQL 即可。
local.server.port=8080
#spring.datasource.url=jdbc:h2:mem:taskdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.sql.init.mode=always

# ---------- MySQL 持久化 ----------
spring.datasource.url=jdbc:mysql://localhost:3306/task_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

mybatis.configuration.map-underscore-to-camel-case=true

spring.jackson.property-naming-strategy=SNAKE_CASE

# 缩短租约到 1 秒、巡检 200ms，便于快速验证租约过期重入队逻辑
task.lease.seconds=1
task.lease.check-interval-ms=200
